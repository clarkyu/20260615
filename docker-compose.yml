services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - app_data:/data
    environment:
      - DATABASE_URL=file:/data/app.db
      - APP_URL=${APP_URL}
      - APP_NAME=${APP_NAME}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    restart: unless-stopped

volumes:
  app_data:
