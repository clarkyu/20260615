name: D1 read-only query

# 生产 D1 只读查询通道(维护用)。手动触发,输入一条 SELECT,结果打进任务日志。
#
# 为什么存在:排查/研究经常只差「生产库里到底是什么」这一步——比如某作业各环节的
# 配置与评阅进度。Cloudflare 的 API token 做不到 SQL 级只读(能 query 即能写),所以
# 通道收在这里:token 只存在于仓库 secrets(与部署同一枚,不新增暴露面),每条查询
# 连同结果都留在 Actions 日志里可审计。
#
# 使用约定(维护者与自动化都遵守):
# - 只放行单条 SELECT / WITH…SELECT;写关键词一律拒绝(下方守卫,粗但够用——
#   有仓库写权限的人本就持有部署级 token,守卫防的是误操作不是恶意)。
# - 最小披露:优先聚合/计数;非必要不查学生姓名/作答原文等个人信息列——
#   查询结果会留在 Actions 日志(私有仓库,默认保留 ~90 天)。
on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SELECT 语句(只读;仅放行 SELECT / WITH…SELECT 单条)'
        required: true
        type: string

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SQL: ${{ github.event.inputs.sql }}
    steps:
      - name: Guard — SELECT only, single statement
        run: |
          set -eu
          # 规范化:去首尾空白,去掉最多一个结尾分号。
          norm="$(printf '%s' "$SQL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/;$//')"
          lower="$(printf '%s' "$norm" | tr '[:upper:]' '[:lower:]')"
          case "$lower" in
            select*|with*) : ;;
            *) echo '::error::only SELECT / WITH…SELECT statements are allowed'; exit 1 ;;
          esac
          # 拒绝多语句(剩余分号)与写关键词(WITH 可以前缀 INSERT/UPDATE/DELETE,须一并拦)。
          if printf '%s' "$norm" | grep -q ';'; then
            echo '::error::multiple statements are not allowed'; exit 1
          fi
          if printf '%s' "$lower" | grep -qwE 'insert|update|delete|drop|alter|create|replace|pragma|attach|detach|vacuum|reindex'; then
            echo '::error::write/DDL keywords are not allowed'; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run query (remote D1)
        run: npx wrangler d1 execute recitation-db --remote --json --command "$SQL"
