name: Deploy to Cloudflare

# Merge to main → build the Workers bundle, apply D1 migrations, deploy.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# App runtime secrets (SESSION_SECRET, RESEND_API_KEY, R2_*, AI keys) are set
# once on the Worker via `wrangler secret put`, not here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Apply D1 migrations
        run: npm run d1:migrate
      - name: Build & deploy (OpenNext → Workers)
        run: npm run cf:deploy
        env:
          # Build stamp baked into the bundle (client + server). The in-app auto-update
          # gate compares this against /api/version and reloads when a new build is live,
          # so a long-lived installed PWA picks up new versions without a manual refresh.
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
