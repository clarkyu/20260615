name: zsb-qbank CI

# 子项目 zsb-qbank(移动题库)的独立门禁:lint + 单测 + 真库迁移/种子断言 + 构建。
# 只在子目录变更时触发;与宿主 ci.yml 互不影响。
on:
  push:
    branches: [main]
    paths: ['zsb-qbank/**', '.github/workflows/zsb-ci.yml']
  pull_request:
    paths: ['zsb-qbank/**', '.github/workflows/zsb-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zsb-qbank
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: zsb
          POSTGRES_PASSWORD: zsb
          POSTGRES_DB: zsb_qbank
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zsb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://zsb:zsb@localhost:5432/zsb_qbank
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      AUTH_DEV_LOGIN: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zsb-qbank/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm db:migrate
      # 种子跑两遍:第二遍证幂等(计数断言内建于脚本,失败即非零退出)。
      - run: pnpm seed
      - run: pnpm seed
      # 单测在迁移 + 种子之后跑:M4 起含对真库的 ai_jobs 集成用例(假 AI 调用器,不打真接口)。
      - run: pnpm test
      - run: pnpm build
      # 性能预算(SPEC §7.7 / M7):学生端路由首屏 JS ≤ 200 KB(gzip)
      - run: pnpm budget
      # 移动视口 e2e(M3 接入,docs/DECISIONS.md D11):开发登录仅本 job 打开;
      # 数据库就是上面已种子的服务容器。
      #
      # 跑的是 **output: standalone 产物**(node .next/standalone/server.js),
      # 也就是 Dockerfile 里线上真正在跑的那个东西 —— 不是 `next start`。
      # 两者不是同一个产物,next 自己在 standalone 模式下也会警告这一点;
      # 以前 CI 测 `next start`、线上发 standalone,等于测的和发的不是一回事(D59)。
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e(对生产 standalone 产物)
        env:
          AUTH_DEV_LOGIN: 'true'
          E2E_BASE_URL: http://localhost:3000
        run: |
          pnpm start:standalone &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          pnpm test:e2e
      # 恢复演练(SPEC §10 M7 验收「备份脚本可恢复到空库」)。
      # 放在 e2e 之后:这时库里才有作答与判分结果,演练才盖得到 attempts / responses
      # 这些真正要命的表 —— 只有种子数据的话,它们是空的,比对等于没比。
      # 跑的是真正的 backup.sh / restore.sh,建临时库比对完再删,不碰 CI 的源库。
      - name: 恢复演练(备份真能救回来)
        run: |
          pg_dump --version
          ./scripts/verify-restore.sh
      # 真构建生产镜像并把它跑起来(SPEC §9.6)。
      # 2026-09-17 之前 CI 从没构建过 Dockerfile,结果它**坏了都没人知道**:
      # 浮动的 node:22-alpine 滚到 Alpine 3.24 后 postgresql16-client 已不存在,apk 直接失败;
      # 而 corepack 没有 packageManager 可依,装的是当时最新的 pnpm(与 lockfile 对不上)。
      # 上面的 e2e 测的是 standalone 产物,这一步测的是**装着它的那个镜像**(D67)。
      # 端口用 3100,避开 e2e 那个还在后台跑的 3000。
      - name: 构建并运行生产镜像
        run: |
          docker build -t zsb-qbank:ci .
          docker run -d --name zsb-app --network host \
            -e DATABASE_URL="$DATABASE_URL" -e SESSION_SECRET="$SESSION_SECRET" \
            -e PORT=3100 zsb-qbank:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:3100/api/health
          # 提示词被 outputFileTracingIncludes 带进镜像了吗(少了主观题就没法评)
          test "$(docker exec zsb-app sh -c 'ls prompts | wc -l')" -ge 8
          # 运维脚本在镜像里真能跑吗(bash + pg 工具都得在,少 bash 就是 can't execute 'bash')
          docker exec -e BACKUP_DIR=/tmp/bk zsb-app ./scripts/backup.sh
          docker logs zsb-app | tail -5
          docker rm -f zsb-app
