name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same ref — only the latest
# commit's result matters for a branch/PR, so superseded runs just waste CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'file:/tmp/ci.db'
      SESSION_SECRET: 'ci-placeholder-secret-at-least-32-characters'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Build the actual Workers bundle (OpenNext) — not just `next build`. This is what
      # `deploy.yml` runs, so a Workers-bundle regression (e.g. an unhoisted esbuild the
      # plain `next build` never touches) fails CI here instead of silently at deploy time.
      - run: npx opennextjs-cloudflare build
